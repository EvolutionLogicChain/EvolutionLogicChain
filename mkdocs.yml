site_name: Evolution Logic Chain Encyclopedia
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs
    - search.suggest
    - search.highlight
  language: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - extra.js

nav:
  - Home: index.md
  - Foreword: Foreword.md
  - Core Concepts: 01-Core-Concepts/README.md
  - Universe Evolution: 02-Universe-Evolution/README.md
  - Life Evolution: 03-Life-Evolution/README.md
  - Intelligence Evolution: 04-Intelligence-Evolution/README.md
  - Civilization Evolution: 05-Civilization-Evolution/README.md
  - Artificial Intelligence Evolution: 06-Artificial-Intelligence-Evolution/README.md
  - 中文:
    - 首页: README_cn.md
    - 前言: Foreword_cn.md
    - 核心概念: 01-Core-Concepts/README_cn.md
    - 宇宙演化: 02-Universe-Evolution/README_cn.md
    - 生命演化: 03-Life-Evolution/README_cn.md
    - 智能演化: 04-Intelligence-Evolution/README_cn.md
    - 文明演化: 05-Civilization-Evolution/README_cn.md
    - 人工智能演化: 06-Artificial-Intelligence-Evolution/README_cn.md
